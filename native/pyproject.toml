[build-system]
requires = ["scikit-build-core>=0.10.0", "pybind11>=2.11", "cmake>=3.15"]
build-backend = "scikit_build_core.build"

[project]
name = "cdae_native"
version = "2.0.0"
description = "C++ DAE XML and CDAE binary parser/writer for Blender addons"
requires-python = ">=3.11"

[tool.scikit-build]
cmake.version = ">=3.15"
wheel.install-dir = "."
sdist.include = ["src/*", "CMakeLists.txt"]

[tool.cibuildwheel]
build = "cp311-* cp313-*"
skip = "*-i686-* pp*"
